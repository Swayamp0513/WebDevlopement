<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Assignments | Swayam Patil</title>
    <style>
        :root {
            --primary: #00e6ff;
            --bg-dark: #0a0e27;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #e0e0e0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27, #1a1f3a);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            letter-spacing: 2px;
            font-size: 24px;
        }

        .user-info {
            margin-top: 10px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        nav {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        nav h3 {
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background: var(--card-bg);
            color: white;
            border: 1px solid rgba(0, 230, 255, 0.3);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            background: rgba(0, 230, 255, 0.2);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        button.active {
            background: var(--primary);
            color: #0a0e27;
            font-weight: bold;
        }

        /* Output Area */
        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: #fff; /* White background for assignment outputs */
        }

        #output-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            background: white;
        }

        .placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #333;
            font-style: italic;
        }

        footer {
            background: var(--bg-dark);
            text-align: center;
            padding: 10px;
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <h1>COURSE: WEB DEVELOPMENT</h1>
    <div class="user-info">
        <span><strong>Name:</strong> Swayam Patil</span>

        <iframe id="output-frame" style="display: none;"></iframe>

<footer>

        9: `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Form Page</title><link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;}body{background-color:#fff;font-family:"Aldrich",sans-serif;padding:30px;}.container{max-width:700px;margin:0 auto;}.header-info{margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid #ddd;}.header-info h3{color:#555;font-size:14px;margin:8px 0;}h1{border:3px solid #333;text-align:center;padding:20px;margin:30px 0;font-size:32px;}form{background:#f9f9f9;padding:30px;border-radius:8px;border:1px solid #e0e0e0;}.form-group{margin-bottom:25px;}.form-note{color:#d32f2f;font-size:13px;margin-bottom:25px;padding:10px;background:#ffe0e0;border-left:4px solid #d32f2f;}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}input[type="text"],input[type="email"],select,textarea{padding:12px;border:1px solid #ccc;border-radius:6px;width:100%;margin-top:8px;}input[type="submit"]{background:#1976d2;color:white;border:none;padding:14px;border-radius:6px;cursor:pointer;width:100%;font-weight:600;}</style></head><body><div class="container"><div class="header-info"><h3>Student Name: Swayam Patil</h3><h3>Roll no.: 125</h3><h3>Assignment: 9 - Form</h3></div><h1>Student Registration</h1><form method="get"><div class="form-note">Please Note: First name, Last Name and Email are required</div><div class="form-group"><div class="form-row"><div><label>First Name:</label><input type="text" placeholder="Enter first name" required></div><div><label>Last Name:</label><input type="text" placeholder="Enter last name" required></div></div></div><div class="form-group"><label>Email:</label><input type="email" placeholder="name@gmail.com" required></div><div class="form-group"><p>Select Stream</p><select required><option value="">-- Select Stream --</option><option>CSE</option><option>CSE-AIML</option></select></div><div class="form-group"><p>Why do         13: `<html><body><h2>My CD Collection (Ass 13)</h2><table border="1"><tr bgcolor="#9acd32"><th>Title</th><th>Artist</th></tr><tr><td>Empire Burlesque</td><td>Bob Dylan</td></tr><tr><td>Greatest Hits</td><td>Dolly Parton</td></tr></table></body></html>`
    };

    function loadAssignment(num, btn) {
        // Handle Active State
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Toggle visibility
        document.getElementById('placeholder-text').style.display = 'none';
        const frame = document.getElementById('output-frame');
        frame.style.display = 'block';

        // Inject HTML into iframe
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(assignmentCodes[num]);
        doc.close();
    }
</script>
