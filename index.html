<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Portfolio | Swayam Patil</title>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Orbitron:wght@500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e6ff;
            --bg-dark: #0a0e27;
            --sidebar-bg: #111827;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 230, 255, 0.2);
            z-index: 10;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .user-info {
            margin-top: 10px;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0.9;
        }

        /* Layout Container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Navigation Sidebar */
        nav {
            width: 300px;
            background: var(--sidebar-bg);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav h3 {
            color: var(--primary);
            font-size: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 230, 255, 0.3);
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background: var(--card-bg);
            color: white;
            border: 1px solid rgba(0, 230, 255, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
        }

        button:hover {
            background: rgba(0, 230, 255, 0.1);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        button.active {
            background: var(--primary);
            color: #0a0e27;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 230, 255, 0.4);
        }

        /* Main Output Frame */
        main {
            flex: 1;
            position: relative;
            background: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #64748b;
        }

        footer {
            background: #020617;
            padding: 8px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<header>
    <h1>Web Development Assignment Series</h1>
    <div class="user-info">
        <span><strong>Name:</strong> Swayam Patil</span>
        <span><strong>Roll No:</strong> 125</span>
        <span><strong>College:</strong> D Y Patil College of Engineering and Technology, Kolhapur</span>
    </div>
</header>

<div class="container">
    <nav>
        <h3>Semester 4 Practicals</h3>
        <div class="btn-list">
            <button onclick="loadAss(1, this)">1: First HTML File</button>
            <button onclick="loadAss(2, this)">2: Static Web Page</button>
            <button onclick="loadAss(3, this)">3: Formatting Tags</button>
            <button onclick="loadAss(4, this)">4: Nested Lists</button>
            <button onclick="loadAss(5, this)">5: Image Attributes</button>
            <button onclick="loadAss(6, this)">6: Iframe Practice</button>
            <button onclick="loadAss(7, this)">7: Image Links</button>
            <button onclick="loadAss(8, this)">8: Basic Table</button>
            <button onclick="loadAss(9, this)">9: Student Registration Form</button>
            <button onclick="loadAss(10, this)">10: Digital Resume</button>
            <button onclick="loadAss(11, this)">11: Advanced Resume</button>
            <button onclick="loadAss(12, this)">12: CD Catalog</button>
            <button onclick="loadAss(13, this)">13: XML Style Table</button>
        </div>
    </nav>

    <main>
        <div class="placeholder" id="placeholder">
            <h2 style="margin-bottom:10px;">Welcome, Swayam!</h2>
            <p>Select an assignment from the sidebar to view output.</p>
        </div>
        <iframe id="viewer" style="display:none;"></iframe>
    </main>
</div>

<footer>
    Prepared by Swayam Patil | &copy; 2026 Academic Portfolio
</footer>

<script>
    const assignments = {
        1: `<!DOCTYPE html><html><head><title>Web Development</title></head><body><h1>This is my first file </h1><h2>using HTML</h2><h2>I'm looking forward to learn HTML5 in DYP college </h2><h3>Thank you.</h3></body></html>`,
        2: `<!DOCTYPE html><html><head><title>Static Web Page</title></head><body><h1>Welcome to My Static Web Page</h1><hr><h3>Name : Swayam Patil</h3><p>This is a simple static web page created using basic HTML tags.</p></body></html>`,
        3: `<!DOCTYPE html><html><body><h1>HTML Text Formatting Tags</h1><hr><h3>Name : Swayam Patil</h3><p><b>Bold</b>, <i>Italic</i>, <u>Underline</u>, <mark>Marked</mark>.</p></body></html>`,
        4: `<!DOCTYPE html><html><body style="font-family:Arial;"><h1>Nested Lists</h1><hr><h3>Name : Swayam Patil</h3><ol><li>Programming<ul><li>Python</li><li>Java</li></ul></li></ol></body></html>`,
        5: `<!DOCTYPE html><html><body style="text-align:center;"><h1>Assignment 5</h1><hr><h3>Swayam Patil - 125</h3><img src="https://drive.google.com/thumbnail?id=1Ku1u5n2P5KT8uu318uRZXmGbpgDcGAGA" style="width:300px; border-radius:10px;"></body></html>`,
        6: `<!DOCTYPE html><html><body style="text-align:center;"><h1>Iframe Practical</h1><iframe src="https://www.example.com" style="width:80%; height:300px;"></iframe></body></html>`,
        7: `<!DOCTYPE html><html><body style="text-align:center;"><h1>Assignment 7</h1><a href="https://www.google.com/">Click to Google</a><br><br><a href="https://www.google.com/"><img src="https://drive.google.com/thumbnail?id=1Ku1u5n2P5KT8uu318uRZXmGbpgDcGAGA" style="width:200px;"></a></body></html>`,
        8: `<html><body><h3>Swayam Patil - 125</h3><h2>Student Info Table</h2><table border="1"><tr><th>Roll</th><th>Name</th></tr><tr><td>125</td><td>Swayam Patil</td></tr></table></body></html>`,
        
        // ASSIGNMENT 9: UPDATED FORM CODE
        9: `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Form Page</title><link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;}body{background-color:#fff;font-family:"Aldrich",sans-serif;padding:30px;}.container{max-width:700px;margin:0 auto;}.header-info{margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid #ddd;}.header-info h3{color:#555;font-size:14px;margin:8px 0;}h1{border:3px solid #333;text-align:center;padding:20px;margin:30px 0;font-size:32px;}form{background:#f9f9f9;padding:30px;border-radius:8px;border:1px solid #e0e0e0;}.form-group{margin-bottom:25px;}.form-note{color:#d32f2f;font-size:13px;margin-bottom:25px;padding:10px;background:#ffe0e0;border-left:4px solid #d32f2f;}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}input[type="text"],input[type="email"],select,textarea{padding:12px;border:1px solid #ccc;border-radius:6px;width:100%;margin-top:8px;}input[type="submit"]{background:#1976d2;color:white;border:none;padding:14px;border-radius:6px;cursor:pointer;width:100%;font-weight:600;}</style></head><body><div class="container"><div class="header-info"><h3>Student Name: Swayam Patil</h3><h3>Roll no.: 125</h3><h3>Assignment: 9 - Form</h3></div><h1>Student Registration</h1><form method="get"><div class="form-note">Please Note: First name, Last Name and Email are required</div><div class="form-group"><div class="form-row"><div><label>First Name:</label><input type="text" placeholder="Enter first name" required></div><div><label>Last Name:</label><input type="text" placeholder="Enter last name" required></div></div></div><div class="form-group"><label>Email:</label><input type="email" placeholder="name@gmail.com" required></div><div class="form-group"><p>Select Stream</p><select required><option value="">-- Select Stream --</option><option>CSE</option><option>CSE-AIML</option></select></div><div class="form-group"><p>Why do you want to join CSI?</p><textarea placeholder="Write your answer here...." required></textarea></div><input type="submit" value="Submit Registration"></form></div></body></html>`,

        10: `<!DOCTYPE html><html><head><style>body{background:#0a0e27;color:white;padding:20px;}</style></head><body><h1>Swayam Patil</h1><p>B.Tech Student</p></body></html>`,
        11: `<!DOCTYPE html><html><head><style>body{background:#0a0e27;color:white;padding:20px;}</style></head><body><h1>Resume V2</h1><p>Skill: Full Stack</p></body></html>`,
        12: `<html><body><h2>CD Collection</h2><table border="1"><tr bgcolor="#9acd32"><th>Title</th><th>Artist</th></tr><tr><td>Empire Burlesque</td><td>Bob Dylan</td></tr></table></body></html>`,
        13: `<html><body><h2>CD Collection (Final)</h2><table border="1"><tr bgcolor="#9acd32"><th>Title</th><th>Artist</th></tr><tr><td>Empire Burlesque</td><td>Bob Dylan</td></tr></table></body></html>`
    };

    function loadAss(num, btn) {
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('placeholder').style.display = 'none';
        const viewer = document.getElementById('viewer');
        viewer.style.display = 'block';
        const doc = viewer.contentWindow.document;
        doc.open();
        doc.write(assignments[num]);
        doc.close();
    }
</script>

</body>
</html>
